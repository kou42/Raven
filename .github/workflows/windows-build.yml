name: Windows Build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-x64:
    name: Debug x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Bootstrap pinned Windows dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows-build.ps1 -InstallVulkanSdk

      - name: Build Debug x64
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Debug -Platform x64 -SkipBootstrap

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-debug-x64-log
          path: artifacts/logs/*.log
          if-no-files-found: ignore
          retention-days: 7


