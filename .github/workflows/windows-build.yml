name: Windows Build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-x64:
    name: Debug x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap pinned Windows dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows-build.ps1 -InstallVulkanSdk

      - name: Build Debug x64
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Debug -Platform x64 -SkipBootstrap

      - name: Build and run Scene Graph regression tests
        shell: pwsh
        run: ./scripts/test-windows-scene.ps1 -SkipBuild -SkipBootstrap

      - name: Measure Component View Debug traversal
        shell: pwsh
        run: ./scripts/measure-windows-scene-view.ps1 -Configuration Debug -Label ci -SkipBuild

      - name: Build and run CPU UI regression tests
        shell: pwsh
        run: ./scripts/test-windows-ui.ps1 -Configuration Debug -Platform x64 -SkipBootstrap

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-debug-x64-logs
          path: artifacts/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  release-x64:
    name: Release x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap pinned Windows dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows-build.ps1 -InstallVulkanSdk

      - name: Build Release x64
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release -Platform x64 -SkipBootstrap

      - name: Measure Scene Graph Release traversal
        shell: pwsh
        run: |
          $output = @(& "./Root/x64/Release/Root.exe" --measure-scene-graph 2>&1)
          $testExit = $LASTEXITCODE
          $output | Set-Content -Encoding utf8 artifacts/logs/windows-scene-measure-release-results.log
          $output | ForEach-Object { Write-Host $_ }
          if ($testExit -ne 0 -or ($output -join "`n") -notmatch 'SceneGraph shape=chain') {
            throw "Scene Graph measurement failed (exit=$testExit)"
          }

      - name: Measure Component View Release traversal
        shell: pwsh
        run: ./scripts/measure-windows-scene-view.ps1 -Configuration Release -Label ci -SkipBuild

      - name: Compare Scene and Chunk Release workloads
        shell: pwsh
        run: ./scripts/measure-windows-scene-runtime.ps1 -Configuration Release -Label ci -SkipBuild

      - name: Build and run CPU UI regression tests
        shell: pwsh
        run: ./scripts/test-windows-ui.ps1 -Configuration Release -Platform x64 -SkipBootstrap

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-x64-logs
          path: artifacts/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  allocation-profile-x64:
    name: UI allocation profiling x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned Windows dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows-build.ps1 -InstallVulkanSdk
      - name: Build and run CPU UI tests with allocation profiling
        shell: pwsh
        run: ./scripts/test-windows-ui.ps1 -Configuration Debug -Platform x64 -AllocationProfiling -SkipBootstrap
      - name: Upload allocation profiling logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-allocation-profile-x64-logs
          path: artifacts/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  gpu-test-build-x64:
    name: GPU integration test build x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap pinned Windows dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows-build.ps1 -InstallVulkanSdk

      - name: Build GPU integration test executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Debug -Platform x64 -RavenUIGPUTest -SkipBootstrap

      - name: Upload GPU test build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gpu-test-build-logs
          path: artifacts/logs/*.log
          if-no-files-found: ignore
          retention-days: 7




  diagnostics-x64:
    name: Diagnostics CPU tests x64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run Diagnostics configurations
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release', 'Disabled', 'MeasurementsDisabled')) {
            ./scripts/test-windows-diagnostics.ps1 -Configuration $configuration
          }
      - name: Upload Diagnostics logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-x64-logs
          path: artifacts/diagnostics/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  structured-data-x64:
    name: Structured Data CPU tests x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run Structured Data CPU tests
        shell: pwsh
        run: ./scripts/test-windows-structured-data.ps1
      - name: Upload Structured Data test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-structured-data-x64-logs
          path: artifacts/structured-data/*.log
          if-no-files-found: ignore
          retention-days: 7
