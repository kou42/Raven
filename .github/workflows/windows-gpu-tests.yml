name: Windows GPU Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-integration:
    name: OpenGL GPU integration
    runs-on:
      - self-hosted
      - Windows
      - X64
      - raven-gpu
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Bootstrap pinned Windows dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows-build.ps1 -InstallVulkanSdk

      - name: Build and run GPU integration tests
        shell: pwsh
        run: ./scripts/test-windows-gpu.ps1 -Configuration Debug -Platform x64 -RequireFontAtlas -SkipBootstrap

      - name: Upload GPU integration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gpu-integration-logs
          path: artifacts/logs/*.log
          if-no-files-found: warn
          retention-days: 14


